name: Auto Assign PR Author

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened

jobs:
  auto-assign:
    permissions:
      contents: read
      pull-requests: write # needed for gh pr edit --add-assignee
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      # github.event.pull_request.assignees == null || length(github.event.pull_request.assignees) == 0
      - if: toJSON(github.event.pull_request.assignees) == '[]'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          gh pr --repo "$REPO" edit "$PR_NUMBER" --add-assignee "$PR_AUTHOR"
