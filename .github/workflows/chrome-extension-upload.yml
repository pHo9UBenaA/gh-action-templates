name: Call chrome-extension-upload-action

on:
  workflow_call:
    inputs:
      extension-id:
        description: "The ID of your Chrome extension."
        required: true
        type: string
      file-path:
        description: "The path to your Chrome extension zip file."
        required: true
        type: string
      publish:
        description: "Whether to publish the extension immediately."
        required: false
        default: "false"
        type: string
    secrets:
      client-id:
        description: "Your Google Cloud Client ID"
        required: true
      client-secret:
        description: "Your Google Cloud Client Secret"
        required: true
      refresh-token:
        description: "Your Google Cloud Refresh Token"
        required: true

permissions: {}

jobs:
  call-chrome-extension-upload:
    name: Upload Chrome Extension
    permissions:
      contents: read # needed for actions/checkout
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Upload Chrome extension
        uses: pHo9UBenaA/chrome-extension-upload-action@843ab237902432dcffe66fe29f0c21fb643a1b8f # master
        with:
          client-id: ${{ secrets.client-id }}
          client-secret: ${{ secrets.client-secret }}
          refresh-token: ${{ secrets.refresh-token }}
          extension-id: ${{ inputs.extension-id }}
          file-path: ${{ inputs.file-path }}
          publish: ${{ inputs.publish }}
