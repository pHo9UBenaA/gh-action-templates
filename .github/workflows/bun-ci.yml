name: Bun CI
on: workflow_call

permissions:
  contents: read

jobs:
  bun-ci:
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: oven-sh/setup-bun@v2

      - run: bun install
      - run: bun run ci --reporter=github
      - run: bun run test
